<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        .outer-box {
            border: 1px solid #88a888;
            padding: 25px 60px;
            width: 80%;
            margin: 30px auto;
        }
        .navbar {
            background-color: #333333;
            padding: 15px 25px;
        }
        .navbar a {
            color: #ffffff;
            text-decoration: none;
            margin-right: 45px;
            font-size: 16px;
            font-family: Georgia, serif;
        }
    </style>
</head>
<body>

    <div class="outer-box">
        <div class="navbar">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Courses</a>
            <a href="#">Contact</a>
        </div>
    </div>

</body>
</html>
