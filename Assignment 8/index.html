<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links Demo</title>
    <style>
        .box {
            border: 1px solid #88a888;
            padding: 25px 60px;
            width: 80%;
            margin: 20px auto;
            font-family: Georgia, serif;
        }
        .spacer {
            height: 280px;
        }
    </style>
</head>
<body>

    <div class="box" id="top">
        <p>Links demo</p>

        <a href="https://google.com" target="_blank">External link</a><br>
        <a href="#bottom">Jump to bottom</a><br>
        <a href="mailto:example@gmail.com">Email us</a><br>
        <a href="#">
            <img src="logo.png" alt="Logo" width="110" height="50">
        </a>

        <div class="spacer"></div>

        <p id="bottom">Bottom. <a href="#top">Back to top</a></p>
    </div>

</body>
</html>
