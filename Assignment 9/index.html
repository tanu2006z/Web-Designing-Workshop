<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting Demo</title>
    <style>
        .box {
            border: 1px solid #88a888;
            padding: 20px 60px;
            width: 80%;
            margin: 20px auto;
            font-family: Georgia, serif;
        }
    </style>
</head>
<body>

    <div class="box">
        <blockquote>
            The best way to predict the future is to create it.
        </blockquote>

        <p>As he said, <q>Stay hungry, stay foolish.</q></p>

        <p>Book: <cite>The Pragmatic Programmer</cite></p>

        <p><abbr title="World Wide Web Consortium">W3C</abbr> sets web standards.</p>

        <address>
            Contact: Admin Office<br>
            College Road, Delhi
        </address>

        <p><del>Old price 500</del> <ins>New price 400</ins></p>
    </div>

</body>
</html>
