<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Demo</title>
    <style>
        .box {
            border: 1px solid #88a888;
            padding: 25px 100px;
            width: 80%;
            margin: 20px auto;
            font-family: Georgia, serif;
        }
    </style>
</head>
<body>

    <div class="box">
        <h4>Image</h4>
        <img src="campus.jpg" alt="College campus" width="150" height="150">

        <h4>Video</h4>
        <video width="200" height="130" controls>
            <source src="sample.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <h4>Audio</h4>
        <audio controls>
            <source src="sample.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <h4>YouTube</h4>
        <iframe width="310" height="180" src="https://youtube.com" title="YouTube video"></iframe>
    </div>

</body>
</html>
