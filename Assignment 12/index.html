<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 12 - Student Marks Table</title>
    <style>
        .box {
            border: 1px solid #88a888;
            padding: 25px 60px;
            width: 80%;
            margin: 20px auto;
            font-family: Georgia, serif;
        }
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #888888;
            padding: 5px 10px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="box">
        <table>
            <caption>Student Marks</caption>
            <thead>
                <tr>
                    <th>Roll</th>
                    <th>Name</th>
                    <th>Marks</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Aman</td>
                    <td>85</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Riya</td>
                    <td>92</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2">Average</td>
                    <td>88.5</td>
                </tr>
            </tfoot>
        </table>
    </div>

</body>
</html>
