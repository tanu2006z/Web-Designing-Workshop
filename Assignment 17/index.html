<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 17 - Form Validation</title>
    <style>
        .box {
            border: 1px solid #88a888;
            padding: 25px 60px;
            width: 80%;
            margin: 20px auto;
            font-family: Georgia, serif;
        }
        .field {
            margin-bottom: 12px;
        }
        input {
            padding: 3px 6px;
            width: 170px;
        }
        input[type="number"] {
            width: 75px;
        }
        button {
            padding: 4px 10px;
        }
    </style>
</head>
<body>

    <div class="box">
        <form action="submit.php" method="post">
            <div class="field">
                <input type="text" name="fullname" placeholder="Full name" required>
            </div>

            <div class="field">
                <input type="email" name="email" placeholder="you@college.edu" required>
            </div>

            <div class="field">
                <input type="tel" name="mobile" placeholder="10-digit mobile" pattern="[0-9]{10}" title="Enter exactly 10 digits" required>
            </div>

            <div class="field">
                <input type="password" name="password" placeholder="Min 6 characters" minlength="6" required>
            </div>

            <div class="field">
                <input type="number" name="age" placeholder="Age (17-30)" min="17" max="30" required>
            </div>

            <button type="submit">Register</button>
        </form>
    </div>

</body>
</html>
